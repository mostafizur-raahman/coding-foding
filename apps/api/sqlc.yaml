version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: db/queries
    gen:
      go:
        package: sqlcdb
        out: internal/repository/postgres/sqlcdb
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: NullUUID
          - db_type: citext
            go_type: string
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: "*time.Time"
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              type: "*time.Time"
          - db_type: text
            nullable: true
            go_type:
              type: "*string"
          - db_type: citext
            nullable: true
            go_type:
              type: "*string"
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: "*int32"
          - db_type: pg_catalog.numeric
            go_type: float64
