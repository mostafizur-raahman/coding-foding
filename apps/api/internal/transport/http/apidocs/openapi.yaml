openapi: 3.0.3
info:
  title: Coding Foding API
  version: "1.0"
  description: |
    HTTP API behind codingfoding. JSON in, JSON out; unknown body fields are rejected (≤ 1 MiB).

    **Auth.** Most endpoints take `Authorization: Bearer <access_token>`. Get a token from
    `POST /auth/login`, then press **Authorize** above and paste it. Tokens last 15 minutes.
    The refresh token lives in an httpOnly cookie scoped to `/api/v1/auth`.

    **Admin.** `/admin/*` needs `role = admin`. There is no UI for it yet:
    `UPDATE users SET role = 'admin' WHERE email = '…';` then log in again (the role is inside the token).

    **Rate limits.** Every `/api/v1` route: 300 burst, 5/s per IP or user. Tighter limits are noted per endpoint.
    Going over returns `429 rate_limited`.
servers:
  - url: /api/v1
    description: This server

tags:
  - name: auth
    description: Sign up with an email code, sign in with a password, keep the session fresh.
  - name: me
    description: The signed-in learner's profile and avatar.
  - name: learning
    description: Lesson reading progress and XP. Part 1 of every track is free; later parts (and all XP) need Pro.
  - name: leaderboard
  - name: careers
  - name: billing
    description: Pro via manual bKash/Nagad payment, verified by an admin.
  - name: roadmap
  - name: blog
    description: Votes on blog posts. Posts are Markdown in the repo; one final vote per reader.
  - name: admin
  - name: misc

security:
  - bearer: []

paths:
  # ───────────────────────────── auth ─────────────────────────────
  /auth/email/start:
    post:
      tags: [auth]
      summary: Email a 6-digit signup code
      description: Same `202` whether or not the email exists. Limit 6 per 10 min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                locale: { $ref: "#/components/schemas/Locale" }
      responses:
        "202": { description: Code sent (if the email can receive one) }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/email/verify:
    post:
      tags: [auth]
      summary: Trade the emailed code for a signup token
      description: Limit 10/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                code: { type: string, pattern: "^[0-9]{6}$", example: "482913" }
      responses:
        "200":
          description: Code accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [signup_required] }
                  signup_token: { type: string }
                  expires_at: { type: string, format: date-time }
        "409":
          description: "`email_taken`: the address already has an account — sign in with the password"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/email/signup:
    post:
      tags: [auth]
      summary: Create the account for a verified email
      description: Starts a session (sets the refresh + CSRF cookies). Limit 10/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signup_token, display_name, district, interests, journey_stage, password]
              properties:
                signup_token: { type: string, minLength: 20, maxLength: 128 }
                display_name: { type: string, maxLength: 64 }
                phone: { type: string, maxLength: 20, example: "01712345678" }
                district: { type: string, maxLength: 32, example: dhaka }
                interests:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, maxLength: 32 }
                  example: [backend]
                journey_stage: { $ref: "#/components/schemas/JourneyStage" }
                password: { type: string, format: password, minLength: 10, maxLength: 128 }
                locale: { $ref: "#/components/schemas/Locale" }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with email + password
      description: 5 failures lock the account for 15 minutes (`423`). Limit 10/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, format: password, maxLength: 128 }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "423": { description: Account locked for a while, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the session
      description: |
        Needs the `cf_rt` cookie plus `X-CSRF-Token` equal to the `cf_csrf` cookie, from an allowed Origin.
        Reusing an old refresh token revokes the whole session family.
      security: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/logout:
    post:
      tags: [auth]
      summary: End the session
      security: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204": { description: Signed out; cookies cleared }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Email a password-reset link
      description: Same `202` whether or not the email exists. Limit 6 per 10 min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "202": { description: Link sent (if the account exists) }

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Set a new password from the emailed token
      description: Signs out every device. Limit 10/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, minLength: 20, maxLength: 128 }
                password: { type: string, format: password, minLength: 10, maxLength: 128 }
      responses:
        "204": { description: Password changed }
        "422": { $ref: "#/components/responses/Invalid" }

  # ───────────────────────────── me ─────────────────────────────
  /me:
    get:
      tags: [me]
      summary: The signed-in user
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      summary: Update profile and preferences
      description: Send only the fields to change. Limit 20 saves an hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, minLength: 1, maxLength: 64 }
                preferred_locale: { $ref: "#/components/schemas/Locale" }
                theme: { type: string, enum: [system, midnight, obsidian, paper, dracula, solarized, matrix] }
                font: { type: string, enum: [default, friendly, anek, bookish, terminal, fira, plex-mono, space-mono] }
                division: { $ref: "#/components/schemas/Division" }
                district: { type: string, maxLength: 32 }
                phone: { type: string, maxLength: 20 }
                journey_stage: { $ref: "#/components/schemas/JourneyStage" }
                interests: { type: array, maxItems: 20, items: { type: string, maxLength: 32 } }
      responses:
        "200": { description: Updated user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }

  /me/avatar:
    post:
      tags: [me]
      summary: Upload a profile photo
      description: Re-encoded server-side to a square JPEG. There is a cooldown between changes (see `avatar_next_change_at`). Limit 10 an hour.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        "200": { description: Updated user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [me]
      summary: Remove the profile photo
      responses:
        "200": { description: Updated user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/applications:
    get:
      tags: [careers]
      summary: Jobs the user has applied to
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_ids: { type: array, items: { type: string, format: uuid } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ───────────────────────────── learning ─────────────────────────────
  /tracks/{slug}/progress:
    get:
      tags: [learning]
      summary: Progress through one track
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string }, example: backend-first-principles }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TrackProgress" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /lessons/{lessonID}/progress:
    get:
      tags: [learning]
      summary: Which sections of a lesson are read, and whether its XP was paid
      parameters: [{ $ref: "#/components/parameters/LessonID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LessonStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /lessons/{lessonID}/open:
    post:
      tags: [learning]
      summary: Start the lesson's reading clock
      description: Re-opening keeps the original time. Limit 20/min.
      parameters: [{ $ref: "#/components/parameters/LessonID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  opened_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`pro_required`: the chapter is past Part 1 and the learner has no Pro (admins pass)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /lessons/{lessonID}/sections/{sectionID}/complete:
    post:
      tags: [learning]
      summary: Mark one section read
      description: |
        Sections go in order, and each needs its minimum reading time since the previous completion.
        Finishing the last section only makes the lesson ready; XP waits for `/complete`. Limit 20/min.
      parameters:
        - $ref: "#/components/parameters/LessonID"
        - { name: sectionID, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SectionResult" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`pro_required`: the chapter is past Part 1 and the learner has no Pro (admins pass)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }

  /lessons/{lessonID}/complete:
    post:
      tags: [learning]
      summary: Complete the lesson (and pay its XP, on Pro)
      description: |
        The lesson must have been opened. Idempotent: pressing it again pays nothing.
        **Only Pro learners earn XP** — for free learners the lesson and streak are recorded with `xp_gained: 0`. Limit 20/min.
      parameters: [{ $ref: "#/components/parameters/LessonID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProgressResult" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`pro_required`: the chapter is past Part 1 and the learner has no Pro (admins pass)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { $ref: "#/components/responses/Invalid" }

  # ───────────────────────────── leaderboard ─────────────────────────────
  /leaderboard:
    get:
      tags: [leaderboard]
      summary: Top learners
      description: Bangladesh-wide, or one division / district. Cached 15 s.
      security: []
      parameters:
        - $ref: "#/components/parameters/BoardDivision"
        - $ref: "#/components/parameters/BoardDistrict"
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/LeaderboardEntry" } }
                  total: { type: integer, format: int64 }

  /leaderboard/me:
    get:
      tags: [leaderboard]
      summary: The signed-in learner's rank
      parameters:
        - $ref: "#/components/parameters/BoardDivision"
        - $ref: "#/components/parameters/BoardDistrict"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Standing" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /stats/path:
    get:
      tags: [misc]
      summary: Learners overall and per journey stage
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer, format: int64 }
                  stages: { type: object, additionalProperties: { type: integer, format: int64 }, example: { why: 12, programming: 40 } }

  /media/avatars/{file}:
    get:
      tags: [misc]
      summary: A profile photo (JPEG)
      description: Keys change on every upload, so responses are cached for a long time.
      security: []
      parameters:
        - { name: file, in: path, required: true, schema: { type: string }, example: 3f2a….jpg }
      responses:
        "200": { description: The image, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── careers ─────────────────────────────
  /jobs:
    get:
      tags: [careers]
      summary: Open jobs
      security: []
      parameters:
        - { name: department, in: query, schema: { $ref: "#/components/schemas/Department" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/JobList" } } } }
        "422": { $ref: "#/components/responses/Invalid" }

  /jobs/{jobID}:
    get:
      tags: [careers]
      summary: One open job
      security: []
      parameters: [{ $ref: "#/components/parameters/JobID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{jobID}/apply:
    post:
      tags: [careers]
      summary: Apply to a job
      description: Learner accounts only (company accounts get `403`). Limit 10 an hour.
      parameters: [{ $ref: "#/components/parameters/JobID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 1000, description: Optional note to the company }
      responses:
        "201":
          description: Applied
          content:
            application/json:
              schema: { type: object, properties: { applied: { type: boolean, example: true } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ───────────────────────────── billing ─────────────────────────────
  /billing/plans:
    get:
      tags: [billing]
      summary: Prices and where to send money
      description: A method is listed only when its number is configured.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans: { type: array, items: { $ref: "#/components/schemas/Plan" } }
                  methods: { type: array, items: { $ref: "#/components/schemas/PayMethod" } }

  /billing/quote:
    get:
      tags: [billing]
      summary: Price for a plan, with a coupon applied
      description: Limit 30 per 10 min.
      parameters:
        - { name: plan, in: query, required: true, schema: { $ref: "#/components/schemas/PlanID" } }
        - { name: coupon, in: query, schema: { type: string, example: EID20 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Quote" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }

  /billing/orders:
    post:
      tags: [billing]
      summary: Submit a bKash/Nagad payment for review
      description: |
        The amount is computed by the server. One pending order per learner (`409 order_pending`);
        a TrxID can only be used once (`409`). Limit 5 an hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, method, payer_number, trx_id]
              properties:
                plan: { $ref: "#/components/schemas/PlanID" }
                coupon: { type: string, maxLength: 32 }
                method: { $ref: "#/components/schemas/PayMethodID" }
                payer_number: { type: string, maxLength: 20, example: "01711111111" }
                trx_id: { type: string, maxLength: 40, example: 9A7B6C5D4E }
      responses:
        "201": { description: Submitted, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentOrder" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /billing/me:
    get:
      tags: [billing]
      summary: The learner's Pro status and orders
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pro_until: { type: string, format: date-time, nullable: true }
                  orders: { type: array, items: { $ref: "#/components/schemas/PaymentOrder" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ───────────────────────────── roadmap ─────────────────────────────
  /roadmap:
    get:
      tags: [roadmap]
      summary: Every roadmap item, in page order
      description: Columns are `shipped → next → horizon → plan`; items within a column by `position`. Cached 60 s (CDN 300 s).
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  stages: { type: array, items: { $ref: "#/components/schemas/RoadmapStage" } }
                  items: { type: array, items: { $ref: "#/components/schemas/RoadmapItem" } }

  # ───────────────────────────── practice ─────────────────────────────
  /me/practice/{collection}:
    get:
      tags: [me]
      summary: Practice items I've marked solved
      description: Slugs in one practice collection (e.g. `sd` for System Design Problems), oldest first. Never cached.
      parameters: [{ $ref: "#/components/parameters/Collection" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  solved: { type: array, items: { type: string }, example: ["parking-lot", "url-shortener"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/practice/{collection}/{slug}:
    put:
      tags: [me]
      summary: Mark a practice item solved
      description: Idempotent. Limit 60 a minute.
      parameters: [{ $ref: "#/components/parameters/Collection" }, { $ref: "#/components/parameters/PracticeSlug" }]
      responses:
        "204": { description: Marked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [me]
      summary: Unmark a practice item
      description: Idempotent. Limit 60 a minute.
      parameters: [{ $ref: "#/components/parameters/Collection" }, { $ref: "#/components/parameters/PracticeSlug" }]
      responses:
        "204": { description: Unmarked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── topics ─────────────────────────────
  /topics:
    get:
      tags: [learning]
      summary: What should we build next?
      description: |
        Community-voted topics, most voted first. Public. With a bearer token, `voted` says whether
        the viewer has voted for each topic. Never cached.
      security: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 8 } }
        - { name: after, in: query, description: "`next_cursor` from the previous page", schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        slug: { type: string, example: redis-internals }
                        title_en: { type: string, example: Redis Internals }
                        title_bn: { type: string }
                        description_en: { type: string, example: "Why Redis is so fast: its data structures inside, the single-threaded event loop…" }
                        description_bn: { type: string }
                        tag: { type: string, example: Redis }
                        vote_count: { type: integer, example: 12 }
                        voted: { type: boolean }
                  next_cursor: { type: string }
        "422": { $ref: "#/components/responses/Invalid" }

  /topics/{topicID}/vote:
    post:
      tags: [learning]
      summary: Vote for a topic, once
      description: One vote per learner per topic, and it's final; voting again is a no-op that returns the current count. Limit 30 per 10 min.
      parameters: [{ name: topicID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Vote recorded (or already there)
          content:
            application/json:
              schema:
                type: object
                properties:
                  topic_id: { type: string, format: uuid }
                  vote_count: { type: integer }
                  voted: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── likes ─────────────────────────────
  /likes/{collection}:
    get:
      tags: [learning]
      summary: Like counts for a practice collection
      description: |
        Public: how many learners liked each item (e.g. collection `hire` for Build to Hire projects).
        Items nobody liked are left out. With a bearer token, `liked` lists the viewer's own likes
        (empty otherwise). Never cached.
      security: []
      parameters: [{ $ref: "#/components/parameters/Collection" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts: { type: object, additionalProperties: { type: integer }, example: { "watch-next": 3, "llm-gateway": 1 } }
                  liked: { type: array, items: { type: string }, example: ["watch-next"] }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/likes/{collection}/{slug}:
    put:
      tags: [me]
      summary: Like a practice item, once
      description: A like is final and can't be taken back. Idempotent; liking twice counts once. Limit 30 a minute.
      parameters: [{ $ref: "#/components/parameters/Collection" }, { $ref: "#/components/parameters/PracticeSlug" }]
      responses:
        "204": { description: Liked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── blog ─────────────────────────────
  /blogs/{postID}/votes:
    get:
      tags: [blog]
      summary: A post's up/down tally
      description: Public. With a bearer token, `my_vote` is the viewer's own vote (`1`, `-1`, or `0` for none). Never cached.
      security: []
      parameters: [{ $ref: "#/components/parameters/PostID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BlogVotes" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /blogs/{postID}/vote:
    post:
      tags: [blog]
      summary: Vote on a post, once
      description: |
        `1` = upvote, `-1` = downvote. A vote is final: sending the same value again is a no-op (`200`),
        the opposite value is refused with `409 already_voted`, and there is no way to take a vote back.
        Limit 30 per 10 min.
      parameters: [{ $ref: "#/components/parameters/PostID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: integer, enum: [1, -1] }
            example: { value: 1 }
      responses:
        "200": { description: Vote recorded (or repeated), content: { application/json: { schema: { $ref: "#/components/schemas/BlogVotes" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  # ───────────────────────────── admin ─────────────────────────────
  /admin/roadmap:
    get:
      tags: [admin, roadmap]
      summary: Every roadmap item, uncached
      description: "Same as `GET /roadmap` but `Cache-Control: no-store`, so the admin panel shows edits immediately."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  stages: { type: array, items: { $ref: "#/components/schemas/RoadmapStage" } }
                  items: { type: array, items: { $ref: "#/components/schemas/RoadmapItem" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin, roadmap]
      summary: Create a roadmap item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoadmapInput" }
            example:
              slug: dsa-graphs
              stage: next
              kind: video
              position: 4
              title: { en: "DSA: Graphs from zero", bn: "DSA: শূন্য থেকে Graph" }
              desc: { en: "BFS, DFS and shortest paths with animations.", bn: "Animation সহ BFS, DFS আর shortest path।" }
              progress: 10
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/RoadmapItem" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /admin/roadmap/{itemID}:
    parameters:
      - { name: itemID, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [admin, roadmap]
      summary: Replace a roadmap item
      description: |
        Replaces **every** field: optional fields you leave out (`desc`, `progress`, `link`) are cleared.
        To move an item between columns, change its `stage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoadmapInput" }
            example:
              slug: dsa-graphs
              stage: shipped
              kind: video
              position: 0
              title: { en: "DSA: Graphs from zero", bn: "DSA: শূন্য থেকে Graph" }
              desc: { en: "BFS, DFS and shortest paths with animations.", bn: "Animation সহ BFS, DFS আর shortest path।" }
              link: /learn/dsa/graphs
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/RoadmapItem" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [admin, roadmap]
      summary: Delete a roadmap item
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/settings:
    get:
      tags: [admin]
      summary: bKash/Nagad numbers learners send money to
      description: A number the admin never saved falls back to the server config (`PAY_BKASH_NUMBER`, `PAY_NAGAD_NUMBER`).
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaySettings" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin]
      summary: Save both payment numbers
      description: |
        `""` turns that method off at checkout. `+88`, spaces and dashes are accepted and stripped.
        The public `/billing/plans` is cached, so checkout may show the old number for up to 5 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaySettings" }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/PaySettings" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }

  /admin/coupons:
    get:
      tags: [admin, billing]
      summary: Every coupon, newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminCoupon" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin, billing]
      summary: Create a coupon
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CouponInput" }
            example: { code: EID20, percent_off: 20, plans: [yearly], max_redemptions: 100, valid_until: "2026-12-31T23:59:59+06:00", active: true, note: Eid campaign }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { type: object, properties: { code: { type: string } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /admin/coupons/{code}:
    put:
      tags: [admin, billing]
      summary: Update a coupon
      description: Replaces everything except the code (taken from the path). Orders already placed keep their price.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: EID20 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CouponInput" }
      responses:
        "200":
          description: Updated
          content: { application/json: { schema: { type: object, properties: { code: { type: string } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }

  /admin/users:
    get:
      tags: [admin]
      summary: Search users
      description: There is deliberately no endpoint that changes a role — admins are made with `make admin` on the server.
      parameters:
        - { name: q, in: query, description: "Part of an email, username or display name", schema: { type: string, maxLength: 100 } }
        - { name: plan, in: query, schema: { type: string, enum: [pro, free] } }
        - { name: status, in: query, schema: { type: string, enum: [active, banned] } }
        - { name: kind, in: query, schema: { type: string, enum: [learner, company, admin] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Newest accounts first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
                  total: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Create a user
      description: The email is trusted, so the account starts verified. Always a learner role; account type can be learner or company.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name, username, email, password, account_type]
              properties:
                display_name: { type: string, maxLength: 80 }
                username: { type: string, pattern: "^[a-zA-Z0-9_]{3,32}$" }
                email: { type: string, format: email }
                password: { type: string, minLength: 10, maxLength: 128 }
                phone: { type: string, nullable: true }
                account_type: { type: string, enum: [learner, company] }
      responses:
        "201": { description: Created }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /admin/overview:
    get:
      tags: [admin]
      summary: Dashboard numbers
      description: Users, Pro, banned, companies, new and active this week, pending payments, 30-day revenue, open jobs, topic votes, project likes, and the six newest signups.
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{userID}:
    parameters:
      - { name: userID, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [admin]
      summary: Edit a user
      description: Name, username, email, phone and account type. A changed email is marked unverified. Roles can't be changed here (only with `make admin`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name, username, email, account_type]
              properties:
                display_name: { type: string, maxLength: 80 }
                username: { type: string, pattern: "^[a-zA-Z0-9_]{3,32}$" }
                email: { type: string, format: email }
                phone: { type: string, nullable: true, description: "Bangladeshi mobile; stored as E.164" }
                account_type: { type: string, enum: [learner, company] }
      responses:
        "204": { description: Saved }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /admin/users/{userID}/ban:
    parameters:
      - { name: userID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [admin]
      summary: Ban a user
      description: The user can't sign in or refresh a session, and every session they have is revoked at once. Admins can't be banned (404), and you can't ban yourself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        "204": { description: Banned }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [admin]
      summary: Lift a ban
      responses:
        "204": { description: Unbanned }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/topics:
    get:
      tags: [admin]
      summary: Every community topic, hidden ones included
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Add a topic to "What should we build next?"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title_en, status]
              properties:
                title_en: { type: string, minLength: 3, maxLength: 120 }
                title_bn: { type: string }
                description_en: { type: string, maxLength: 400 }
                description_bn: { type: string }
                tag: { type: string, maxLength: 30 }
                status: { type: string, enum: [open, planned, hidden] }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { id: { type: string, format: uuid } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  /admin/topics/{topicID}:
    parameters:
      - { name: topicID, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [admin]
      summary: Edit a topic (titles, description, tag, status)
      description: "`hidden` takes it off the home page without losing its votes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title_en, status]
              properties:
                title_en: { type: string, minLength: 3, maxLength: 120 }
                title_bn: { type: string }
                description_en: { type: string, maxLength: 400 }
                description_bn: { type: string }
                tag: { type: string, maxLength: 30 }
                status: { type: string, enum: [open, planned, hidden] }
      responses:
        "204": { description: Saved }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }

  /admin/jobs:
    get:
      tags: [admin]
      summary: Every job from every company, hidden ones included
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/jobs/{jobID}/published:
    parameters:
      - { name: jobID, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [admin]
      summary: Hide a job from the careers page, or put it back
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [published], properties: { published: { type: boolean } } } } }
      responses:
        "204": { description: Saved }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/audit:
    get:
      tags: [admin]
      summary: Admin activity, newest first
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{userID}/pro:
    parameters:
      - { name: userID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [admin]
      summary: Give Pro by hand
      description: For gifts, refunds or payments made outside checkout. Extends from `max(now, pro_until)`, like an approved payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days: { type: integer, minimum: 1, maximum: 3660, example: 30 }
      responses:
        "200":
          description: Granted
          content: { application/json: { schema: { type: object, properties: { pro_until: { type: string, format: date-time } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [admin]
      summary: End Pro now
      responses:
        "204": { description: Pro removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/payments:
    get:
      tags: [admin, billing]
      summary: Payments to review
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected], default: pending } }
      responses:
        "200":
          description: Up to 100 orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ReviewOrder" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/payments/{orderID}/approve:
    post:
      tags: [admin, billing]
      summary: Approve a payment and extend Pro
      description: Pro is extended from `max(now, pro_until)` by the plan's days; the learner gets an email.
      parameters: [{ $ref: "#/components/parameters/OrderID" }]
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { type: object, properties: { pro_until: { type: string, format: date-time } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/payments/{orderID}/reject:
    post:
      tags: [admin, billing]
      summary: Reject a payment
      description: The reason is emailed to the learner.
      parameters: [{ $ref: "#/components/parameters/OrderID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1200, example: "TrxID statement এ পাওয়া যায়নি।" }
      responses:
        "204": { description: Rejected }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The `access_token` from `/auth/login` (15 min).

  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must equal the `cf_csrf` cookie.
      schema: { type: string }
    LessonID:
      name: lessonID
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobID:
      name: jobID
      in: path
      required: true
      schema: { type: string, format: uuid }
    Collection:
      name: collection
      in: path
      required: true
      description: Practice collection, e.g. `sd` (System Design Problems)
      schema: { type: string, pattern: "^[a-z0-9-]{1,40}$" }
    PracticeSlug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9-]{1,100}$" }
    PostID:
      name: postID
      in: path
      required: true
      description: The post's permanent id (frontmatter `id`)
      schema: { type: string, format: uuid }
    OrderID:
      name: orderID
      in: path
      required: true
      schema: { type: string, format: uuid }
    BoardDivision:
      name: division
      in: query
      description: One division's board. Leave out (with `district`) for Bangladesh-wide.
      schema: { $ref: "#/components/schemas/Division" }
    BoardDistrict:
      name: district
      in: query
      description: One district's board.
      schema: { type: string }

  responses:
    Session:
      description: Signed in. Also sets the `cf_rt` (httpOnly) and `cf_csrf` cookies.
      content:
        application/json:
          schema:
            type: object
            properties:
              user: { $ref: "#/components/schemas/User" }
              access_token: { type: string }
              expires_at: { type: string, format: date-time }
    Unauthorized:
      description: Missing, invalid or expired credentials
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Not allowed (e.g. not an admin, or a failed CSRF check)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Conflicts with existing data (`code` says what)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Invalid:
      description: Invalid input (`code` names the rule; `fields` lists per-field failures)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Too many requests
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: invalid_stage }
            message: { type: string }
            request_id: { type: string }
            fields: { type: object, additionalProperties: { type: string } }

    Locale: { type: string, enum: [en, bn] }
    Division: { type: string, enum: [dhaka, chattogram, rajshahi, khulna, barishal, sylhet, rangpur, mymensingh] }
    JourneyStage: { type: string, enum: [why, programming, dsa, os, networking, system-design, goal] }
    Department: { type: string, enum: [backend, frontend, mobile, data-ai, devops, qa, design, product] }
    PlanID: { type: string, enum: [monthly, yearly] }
    PayMethodID: { type: string, enum: [bkash, nagad] }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        username: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [learner, admin] }
        preferred_locale: { $ref: "#/components/schemas/Locale" }
        theme: { type: string }
        font: { type: string }
        division: { type: string, nullable: true }
        district: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        interests: { type: array, items: { type: string } }
        avatar_url: { type: string, nullable: true }
        avatar_next_change_at: { type: string, format: date-time, nullable: true, description: "null = a new photo is allowed now" }
        journey_stage: { $ref: "#/components/schemas/JourneyStage" }
        account_type: { type: string, enum: [learner, company] }
        pro_until: { type: string, format: date-time, nullable: true, description: Pro while this is in the future }
        xp: { type: integer, format: int64 }
        current_streak: { type: integer }
        longest_streak: { type: integer }

    LessonStatus:
      type: object
      properties:
        lesson_id: { type: string, format: uuid }
        done_sections: { type: array, items: { type: string }, description: In reading order }
        sections_total: { type: integer }
        completed: { type: boolean }
        xp_reward: { type: integer, description: What completing pays a Pro learner }

    SectionResult:
      type: object
      properties:
        lesson_id: { type: string, format: uuid }
        section_id: { type: string }
        sections_done: { type: integer }
        sections_total: { type: integer }
        already_done: { type: boolean }
        ready: { type: boolean, description: Every section read — the lesson can now be completed }

    ProgressResult:
      type: object
      properties:
        xp_gained: { type: integer, format: int64, description: "0 for free learners and repeat completions" }
        total_xp: { type: integer, format: int64 }
        current_streak: { type: integer }
        already_completed: { type: boolean }

    TrackProgress:
      type: object
      properties:
        completed: { type: integer }
        total: { type: integer }
        groups:
          type: object
          additionalProperties:
            type: object
            properties:
              completed: { type: integer }
              total: { type: integer }
        lessons:
          type: array
          items:
            type: object
            properties:
              lesson_id: { type: string, format: uuid }
              slug: { type: string }
              group: { type: string, nullable: true }
              position: { type: integer }
              sections_done: { type: integer }
              sections_total: { type: integer }
              done: { type: boolean }
              last_section_id: { type: string, nullable: true }

    LeaderboardEntry:
      type: object
      properties:
        rank: { type: integer, format: int64 }
        user_id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        division: { type: string, nullable: true }
        district: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        xp: { type: integer, format: int64 }
        current_streak: { type: integer }

    Standing:
      type: object
      properties:
        rank: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        xp: { type: integer, format: int64 }
        top_percent: { type: number, example: 0.5, description: '0.5 → "top 0.5%"' }
        percentile: { type: number, example: 99.5 }
        in_top_1_percent: { type: boolean }

    CompanyBrief:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        logo_url: { type: string, nullable: true }
        verified: { type: boolean }
        demo: { type: boolean, description: 'Sample data, shown with a "Demo" badge' }

    JobSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        department: { $ref: "#/components/schemas/Department" }
        employment_type: { type: string }
        level: { type: string }
        workplace: { type: string }
        location: { type: string }
        salary_min: { type: integer, nullable: true, description: "Monthly BDT; null = negotiable" }
        salary_max: { type: integer, nullable: true }
        summary: { type: string }
        skills: { type: array, items: { type: string } }
        posted_at: { type: string, format: date-time }
        closes_at: { type: string, format: date-time, nullable: true }
        company: { $ref: "#/components/schemas/CompanyBrief" }

    JobList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/JobSummary" } }
        departments: { type: object, additionalProperties: { type: integer }, description: Open jobs per department (every department present) }
        total: { type: integer }

    Job:
      allOf:
        - $ref: "#/components/schemas/JobSummary"
        - type: object
          properties:
            description: { type: string }
            responsibilities: { type: array, items: { type: string } }
            requirements: { type: array, items: { type: string } }
            company:
              allOf:
                - $ref: "#/components/schemas/CompanyBrief"
                - type: object
                  properties:
                    tagline: { type: string }
                    about: { type: string }
                    website: { type: string, nullable: true }
                    size: { type: string, nullable: true }
                    district: { type: string, nullable: true }

    Plan:
      type: object
      properties:
        id: { $ref: "#/components/schemas/PlanID" }
        list_amount: { type: integer, description: Crossed-out price (taka), example: 499 }
        amount: { type: integer, description: Price before any coupon (taka), example: 299 }
        period_days: { type: integer, example: 30 }
        per_month: { type: integer, example: 299 }

    PayMethod:
      type: object
      properties:
        id: { $ref: "#/components/schemas/PayMethodID" }
        number: { type: string, example: "01700000000" }

    Quote:
      type: object
      properties:
        plan: { $ref: "#/components/schemas/PlanID" }
        period_days: { type: integer }
        list_amount: { type: integer }
        base_amount: { type: integer }
        coupon: { type: string, nullable: true }
        percent_off: { type: integer }
        discount_amount: { type: integer }
        amount: { type: integer, description: What to send (taka) }

    PaymentOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        plan: { $ref: "#/components/schemas/PlanID" }
        period_days: { type: integer }
        list_amount: { type: integer }
        base_amount: { type: integer }
        discount_amount: { type: integer }
        amount: { type: integer }
        coupon: { type: string, nullable: true }
        method: { $ref: "#/components/schemas/PayMethodID" }
        payer_number: { type: string }
        trx_id: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        reject_reason: { type: string, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ReviewOrder:
      allOf:
        - $ref: "#/components/schemas/PaymentOrder"
        - type: object
          properties:
            user_email: { type: string, format: email }
            user_name: { type: string }

    PaySettings:
      type: object
      properties:
        bkash_number: { type: string, example: "01712345678", description: '"" = bKash off' }
        nagad_number: { type: string, example: "", description: '"" = Nagad off' }

    CouponInput:
      type: object
      required: [code, percent_off]
      properties:
        code: { type: string, pattern: "^[A-Z0-9-]{3,32}$", description: Upper-cased for you }
        percent_off: { type: integer, minimum: 1, maximum: 90 }
        plans: { type: array, items: { $ref: "#/components/schemas/PlanID" }, description: "Empty = every plan" }
        max_redemptions: { type: integer, minimum: 1, nullable: true, description: "Total uses; null = unlimited" }
        valid_until: { type: string, format: date-time, nullable: true, description: "null = no end date" }
        active: { type: boolean }
        note: { type: string, maxLength: 200 }

    AdminCoupon:
      allOf:
        - $ref: "#/components/schemas/CouponInput"
        - type: object
          properties:
            redeemed: { type: integer, description: Orders under review or approved }
            created_at: { type: string, format: date-time }

    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [learner, mentor, admin] }
        account_type: { type: string, enum: [learner, company] }
        pro_until: { type: string, format: date-time, nullable: true }
        xp: { type: integer, format: int64 }
        last_active_date: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time }

    BlogVotes:
      type: object
      properties:
        post_id: { type: string, format: uuid }
        up: { type: integer, example: 42 }
        down: { type: integer, example: 3 }
        my_vote: { type: integer, enum: [1, 0, -1], description: "The viewer's vote; 0 = none or anonymous" }

    RoadmapStage:
      type: string
      enum: [shipped, next, horizon, plan]
    RoadmapKind:
      type: string
      enum: [video, article, feature, problems, interactive, community, event, product]
    Localized:
      type: object
      properties:
        en: { type: string }
        bn: { type: string }

    RoadmapItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, example: careers-portal }
        stage: { $ref: "#/components/schemas/RoadmapStage" }
        kind: { $ref: "#/components/schemas/RoadmapKind" }
        position: { type: integer }
        title: { $ref: "#/components/schemas/Localized" }
        desc: { $ref: "#/components/schemas/Localized" }
        progress: { type: integer, nullable: true, description: Only in `next` }
        link: { type: string, nullable: true, example: /careers }
        shipped_at: { type: string, format: date-time, nullable: true, description: Only in `shipped` }
        updated_at: { type: string, format: date-time }

    RoadmapInput:
      type: object
      required: [slug, stage, kind, title]
      description: |
        Stage rules: `progress` is kept only in `next`; `shipped_at` only in `shipped`.
        Moving to `shipped` without a `shipped_at` stamps the current time; an already-shipped item keeps its date.
      properties:
        slug: { type: string, pattern: "^[a-z0-9-]{2,64}$" }
        stage: { $ref: "#/components/schemas/RoadmapStage" }
        kind: { $ref: "#/components/schemas/RoadmapKind" }
        position: { type: integer, minimum: 0, default: 0 }
        title:
          type: object
          required: [en, bn]
          properties:
            en: { type: string, maxLength: 160 }
            bn: { type: string, maxLength: 160 }
        desc:
          type: object
          properties:
            en: { type: string, maxLength: 400 }
            bn: { type: string, maxLength: 400 }
        progress: { type: integer, minimum: 0, maximum: 100, nullable: true }
        link: { type: string, maxLength: 300, nullable: true, description: "A site path (/learn/…) or an https:// URL" }
        shipped_at: { type: string, format: date-time, nullable: true }
